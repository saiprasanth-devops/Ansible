- name: "this code is used to install in the server"
  hosts: frontend
  become: yes
  vars:
    data: hello1
    server: server1
  tasks:
    - name: "install the nginx in the server"
      ansible.builtin.package:
        name: nginx
        state: present


    - name: " enabel the nginx"
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
    
    - name: "print the values"
      ansible.builtin.debug:
        msg:
          - "The target environment is {{ data }}"
          - "The target environment is {{ server }}"




    